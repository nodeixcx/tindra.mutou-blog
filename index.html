<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tindra. mutou's blog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        dark: '#111827'
                    },
                    fontFamily: {
                        sans: ['system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass {
                background: rgba(255,255,255,0.08);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255,255,255,0.12);
            }
            .text-shadow {
                text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-gray-900 to-zinc-900 min-h-screen text-gray-100">
    <!-- 导航栏 -->
    <header class="glass sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-white">我的博客</h1>
            <nav class="space-x-6 text-sm">
                <a href="#home" class="hover:text-blue-400 transition">首页</a>
                <a href="#articles" class="hover:text-blue-400 transition">文章</a>
                <a href="#about" class="hover:text-blue-400 transition">关于我</a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10">
        <!-- Hero区域 -->
        <section id="home" class="py-16 text-center">
            <h2 class="text-[clamp(2rem,5vw,3rem)] font-bold text-shadow mb-4">欢迎来到我的小站</h2>
            <p class="text-gray-300 max-w-2xl mx-auto text-lg">记录想法、生活与碎片，在这里写下属于自己的文字。</p>
        </section>

        <!-- 文章列表区域，数据从Supabase读取 -->
        <section id="articles" class="py-10">
            <h3 class="text-2xl font-semibold mb-8 border-l-4 border-blue-500 pl-3">最新文章</h3>
            <div id="articleList" class="grid gap-6 md:grid-cols-2">
                <div class="glass p-6 rounded-xl animate-pulse">
                    <div class="h-5 bg-gray-700 rounded w-3/4 mb-3"></div>
                    <div class="h-3 bg-gray-700 rounded w-full mb-2"></div>
                    <div class="h-3 bg-gray-700 rounded w-5/6"></div>
                </div>
                <div class="glass p-6 rounded-xl animate-pulse">
                    <div class="h-5 bg-gray-700 rounded w-3/4 mb-3"></div>
                    <div class="h-3 bg-gray-700 rounded w-full mb-2"></div>
                    <div class="h-3 bg-gray-700 rounded w-5/6"></div>
                </div>
            </div>
        </section>

        <!-- 关于我 -->
        <section id="about" class="py-12">
            <h3 class="text-2xl font-semibold mb-6 border-l-4 border-blue-500 pl-3">关于我</h3>
            <div class="glass p-8 rounded-xl">
                <p class="text-gray-300 leading-relaxed">
                    这里可以写你的自我介绍。本博客使用 Supabase 存储文章数据，纯前端单文件页面。
                </p>
            </div>
        </section>
    </main>

    <footer class="text-center py-8 text-gray-500 text-sm border-t border-gray-800 mt-10">
        © 2026 个人博客 · 全部内容在这里
    </footer>

    <script>
        // ====================== 在这里填入你自己的 Supabase 配置 ======================
        const SUPABASE_URL = "https://obftrwkxgydtjrrsxorc.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iZnRyd2t4Z3lkdGpycnN4b3JjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0ODk1MDUsImV4cCI6MjEwNjA2NTUwNX0.2ebhUXwVGVfbA_gs-WwEHLWh6c2YUJeCegexgt6oFXg";
        // ==========================================================================

        // 初始化 supabase
        let supabase = null;
        if(SUPABASE_URL !== "YOUR_SUPABASE_URL" && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY"){
            const { createClient } = window.supabase;
            supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            loadArticles();
        }else{
            document.getElementById("articleList").innerHTML = `
                <div class="glass p-6 rounded-xl md:col-span-2 text-center text-gray-400">
                    请修改代码顶部填入你的 Supabase URL 和 Anon Key
                </div>
            `
        }

        // 从supabase读取文章，你的表名建议叫 articles
        /*
        建表SQL参考（在Supabase SQL编辑器执行）
        create table articles (
          id bigint generated by default as identity primary key,
          title text not null,
          summary text,
          created_at timestamp with time zone default now(),
          content text
        );
        记得开启表的公开select权限
        */
        async function loadArticles(){
            const listDom = document.getElementById("articleList");
            try {
                const { data, error } = await supabase
                    .from('articles')
                    .select('id,title,summary,created_at')
                    .order('created_at',{ascending:false})
                    .limit(10);

                if(error) throw error;

                if(!data || data.length === 0){
                    listDom.innerHTML = `<div class="glass p-6 rounded-xl md:col-span-2 text-center text-gray-400">暂无文章</div>`;
                    return;
                }

                let html = '';
                data.forEach(item=>{
                    const time = new Date(item.created_at).toLocaleDateString();
                    html += `
                    <div class="glass p-6 rounded-xl hover:border-blue-500/40 transition cursor-pointer">
                        <h4 class="text-lg font-medium mb-2 text-white">${escapeHtml(item.title)}</h4>
                        <p class="text-gray-400 text-sm mb-3 line-clamp-2">${escapeHtml(item.summary||"")}</p>
                        <div class="text-xs text-gray-500">${time}</div>
                    </div>
                    `
                })
                listDom.innerHTML = html;
            } catch (err) {
                listDom.innerHTML = `<div class="glass p-6 rounded-xl md:col-span-2 text-center text-red-400">读取文章失败：${err.message}</div>`
            }
        }

        //简单html转义，防止XSS
        function escapeHtml(str){
            if(!str) return "";
            return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
        }
    </script>
</body>
</html>
