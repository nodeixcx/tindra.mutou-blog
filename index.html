<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8" />
<meta name="viewport" content="width=device‑width, initial‑scale=1.0" />
<title>My blog</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase‑js@2"></script>
<script>
tailwind.config = {
  theme:{
    extend:{
      colors:{
        aoba:"#3A647C",
        wakaba:"#87B899"
      }
    }
  }
}
</script>
<style>
*{‑webkit‑tap‑highlight‑color:transparent;}
html{scroll‑behavior:smooth;}
body{
  background‑color:#f4f8f7;
  background‑image:
    radial‑gradient(circle at 10% 0%, rgba(135,184,153,0.22), transparent 55%),
    radial‑gradient(circle at 90% 20%, rgba(58,100,124,0.12), transparent 65%);
}
.card‑item{
  border:1px solid rgba(58,100,124,0.11);
  background:rgba(255,255,255,0.74);
  border‑radius:16px;
  transition:transform 0.24s cubic‑bezier(.2,.7,.2,1), box‑shadow 0.24s cubic‑bezier(.2,.7,.2,1);
}
.card‑item:hover{
  transform:translateY(‑2px);
  box‑shadow:0 10px 24px rgba(58,100,124,0.09);
}
</style>
</head>
<body class="text‑[#243640]">
<div class="relative z‑10 max‑w‑6xl mx‑auto px‑6 pt‑8 pb‑4 flex items‑center justify‑between">
  <a href="index.html" class="flex items‑center gap‑3 text‑xl font‑serif text‑aoba">My blog</a>
  <nav class="hidden sm:flex gap‑8 text‑aoba">
    <a href="index.html">Home page</a>
    <a href="#articles">Article</a>
    <a href="forum.html">Forum</a>
    <a href="#about">About me</a>
  </nav>
  <div class="flex gap‑3">
    <a href="forum.html" class="px‑3 py‑2 rounded‑full border border‑aoba/30 text‑aoba text‑sm">论坛</a>
    <a href="#articles" class="bg‑aoba text‑white px‑4 py‑2 rounded‑full">Start reading</a>
  </div>
</div>

<main class="max‑w‑6xl mx‑auto px‑6 pt‑12 pb‑16">
  <span class="inline‑block px‑3 py‑1 rounded‑full bg‑[rgba(135,184,153,0.22)] text‑wakaba text‑sm mb‑5">独立记录 · 长期写作</span>
  <h1 class="text‑4xl md:text‑5xl font‑serif leading‑tight text‑aoba">
    一些胡言乱语吧<br/>
    <span class="relative">耐心聆听文字的声音</span>
  </h1>
  <p class="mt‑6 max‑w‑2xl opacity‑80">爱智慧</p>

  <div class="card‑item p‑6 mt‑10 max‑w‑xl">
    <div class="flex justify‑between items‑start">
      <span class="text‑sm opacity‑70">近期状态</span>
      <span class="px‑2 py‑0.5 rounded‑full bg‑wakaba/20 text‑wakaba text‑xs">写作中</span>
    </div>
    <blockquote class="mt‑3 text‑lg">为了伟大的生命而奔跑。</blockquote>
  </div>
</main>

<section id="articles" class="max‑w‑6xl mx‑auto px‑6 pb‑20">
  <div class="flex justify‑between items‑end mb‑8">
    <h2 class="text‑3xl font‑serif text‑aoba">最新文章</h2>
    <span class="text‑xs opacity‑60">按时间倒序</span>
  </div>
  <div id="articleList" class="flex flex‑col gap‑5">
    <!-- loading骨架 -->
    <div class="card‑item p‑7"><div class="h‑5 w‑40 bg‑aoba/10 rounded"></div></div>
  </div>
</section>

<!-- 🎵音乐模块 QQ音乐无法iframe，改为按钮跳转QQ音乐网页版 -->
<section class="max‑w‑6xl mx‑auto px‑6 pb‑20">
  <h3 class="text‑2xl font‑serif text‑aoba mb‑5">随听</h3>
  <div class="card‑item p‑6">
    <p class="opacity‑80 mb‑4">当前曲目：可以在这里填写歌曲名字</p>
    <a target="_blank" href="https://y.qq.com/" class="inline‑block bg‑wakaba/20 text‑wakaba px‑5 py‑2 rounded‑full">打开QQ音乐网页版 →</a>
    <div class="mt‑3 text‑xs opacity‑50">浏览器限制，网站无法直接内嵌QQ音乐播放器，点击跳转网页播放</div>
  </div>
</section>

<section id="about" class="max‑w‑6xl mx‑auto px‑6 pb‑28">
  <h2 class="text‑3xl font‑serif text‑aoba mb‑6">关于我</h2>
  <div class="card‑item p‑7">
    <p>学习绘画，写作
    尝试制作游戏ing
    精神状态不好第一个木头</p>
  </div>
</section>

<footer class="border‑t border‑aoba/12 py‑8 text‑center text‑xs opacity‑60">
© My blog
</footer>

<script src="./common.js"></script>
<script>
async function loadArticles(){
  const dom = document.querySelector("#articleList");
  const {data,error}=await supabase
    .from("articles")
    .select("id,title,summary,created_at")
    .order("created_at",{ascending:false});

  if(error||!data||data.length===0){
    dom.innerHTML = `<div class="card‑item p‑7 text‑center opacity‑70">还没有文章</div>`;
    return;
  }
  let html = "";
  data.forEach(item=>{
    const date = new Date(item.created_at).toLocaleDateString("zh‑CN");
    html += `
    <a href="article.html?id=${item.id}" class="card‑item block p‑7">
      <div class="flex justify‑between items‑start">
        <h3 class="text‑xl font‑serif text‑aoba">${escapeHtml(item.title)}</h3>
        <span class="text‑xs opacity‑60 shrink‑0 ml‑3">${date}</span>
      </div>
      <p class="mt‑3 opacity‑80">${escapeHtml(item.summary||"")}</p>
      <div class="mt‑4 text‑sm text‑aoba/80">阅读全文 →</div>
    </a>
    `
  })
  dom.innerHTML = html;
}
loadArticles();
</script>
</body>
</html>
