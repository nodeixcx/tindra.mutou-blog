<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posts | tindra.mutou's blog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="site-title">tindra.mutou's blog</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="posts.html">Posts</a>
    <a href="search.html">Search</a>
    <a href="archive.html">Archive</a>
    <a href="friends.html">Friends</a>
    <button id="themeBtn">Toggle Dark</button>
  </nav>
</header>
<main>
<h2>All Posts</h2>
<div id="filter-tip"></div>
<div id="post-list"></div>
</main>
<footer>© 2026 tindra.mutou's blog</footer>
<script src="common.js" type="module"></script>
<script>
const params = new URLSearchParams(location.search);
const cate = params.get('cate');
const tag = params.get('tag');
let arr = articleData;
let tip = "All posts";
if(cate){
  arr = arr.filter(x=>x.category===cate);
  tip = `Category: ${cate}`
}
if(tag){
  arr = arr.filter(x=>x.tags.includes(tag));
  tip = `Tag: ${tag}`
}
document.querySelector('#filter-tip').innerText = tip;
const plist = document.querySelector('#post-list');
arr.forEach(a=>{
  plist.innerHTML += `
  <div class="card">
    <a href="post.html?id=${a.id}"><h4>${a.title}</h4></a>
    <div>${a.date}｜${a.category}</div>
    <div class="tags">${a.tags.map(t=>`<span>${t}</span>`).join('')}</div>
    <p>${a.excerpt}</p>
  </div>`
})
</script>
</body>
</html>
