<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posts | tindra.mutou's blog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="site-title">tindra.mutou's blog</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="posts.html">Posts</a>
    <a href="search.html">Search</a>
    <a href="archive.html">Archive</a>
    <a href="friends.html">Friends</a>
    <button id="themeBtn">Toggle Dark</button>
  </nav>
</header>
<main>
<h2>All Posts</h2>
<div id="filter-tip"></div>
<div id="post-list"></div>
</main>
<footer>© 2026 tindra.mutou's blog</footer>
<script src="common.js" type="module"></script>
<script>
(async ()=>{
  const plist = document.querySelector('#post-list');
  const tipEl = document.querySelector('#filter-tip');
  plist.innerHTML = "<p>Loading posts...</p>";

  await window.fetchAllArticles();
  const params = new URLSearchParams(location.search);
  const cate = params.get('cate');
  const tag = params.get('tag');

  let arr = [...window.articleData];
  let tip = "All posts";

  if(cate){
    arr = arr.filter(x=>x.category === cate);
    tip = `Category: ${cate}`;
  }
  if(tag){
    arr = arr.filter(x=>{
      const tArr = x.tags || [];
      return tArr.includes(tag);
    });
    tip = `Tag: ${tag}`;
  }

  tipEl.innerText = tip;
  plist.innerHTML = "";

  if(arr.length === 0){
    plist.innerHTML = "<p>No posts found.</p>";
    return;
  }

  arr.forEach(a=>{
    const tagList = a.tags || [];
    plist.innerHTML += `
    <div class="card">
      <a href="post.html?id=${a.id}"><h4>${a.title}</h4></a>
      <div>${a.date}｜${a.category||"Uncategorized"}</div>
      <div class="tags">${tagList.map(t=>`<span>${t}</span>`).join('')}</div>
      <p>${a.excerpt}</p>
    </div>`
  })
})()
</script>
</body>
</html>
