<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posts | tindra.mutou's blog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="site-title">tindra.mutou's blog</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="posts.html">Posts</a>
    <a href="search.html">Search</a>
    <a href="archive.html">Archive</a>
    <a href="friends.html">Friends</a>
    <a href="feed.xml">RSS</a>
    <button id="themeBtn">Toggle Dark</button>
  </nav>
</header>
<main>
<h2>All Posts</h2>
<div id="filter-tip"></div>
<div id="post-list"></div>
</main>
<footer>
  <p>© 2026 tindra.mutou · All content CC BY‑NC‑SA 4.0</p>
  <p>Powered by plain HTML & CSS | No analytics, no trackers</p>
</footer>

<script type="module" src="common.js"></script>
<script type="module">
(async function(){
  await import("./common.js");
  const plist = document.querySelector('#post-list');
  const tipEl = document.querySelector('#filter-tip');
  plist.innerHTML = "<p>Loading posts...</p>";

  try{
    await window.fetchAllArticles();
    console.log("获取文章数量：", window.articleData.length);

    const params = new URLSearchParams(location.search);
    const cate = params.get('cate');
    const tag = params.get('tag');

    let arr = [...window.articleData];
    let tip = "All posts";

    if(cate){
      arr = arr.filter(x=>x.category === cate);
      tip = `Category: ${cate}`;
    }
    if(tag){
      arr = arr.filter(x=>{
        const tArr = x.tags || [];
        return tArr.includes(tag);
      });
      tip = `Tag: ${tag}`;
    }

    tipEl.innerText = tip;
    plist.innerHTML = "";

    if(arr.length === 0){
      plist.innerHTML = "<p>No posts found.</p>";
      return;
    }

    arr.forEach(a=>{
      const tagList = a.tags || [];
      plist.innerHTML += `
      <div class="card">
        <a href="post.html?id=${a.id}"><h4>${a.title}</h4></a>
        <div>${a.date}｜${a.category||"Uncategorized"}</div>
        <div class="tags">${tagList.map(t=>`<span>${t}</span>`).join('')}</div>
        <p>${a.excerpt}</p>
      </div>`
    })
  }catch(err){
    console.error(err);
    plist.innerHTML = `<p>加载失败：${err.message}</p>`;
  }
})();
</script>
</body>
</html>
